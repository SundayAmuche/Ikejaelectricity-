<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IkejaElectricity</title>
  <!-- Pi Wallet SDK -->
  <script src="https://sandbox.minepi.com/pi.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
    button { background-color: #8A2BE2; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>
  <h2>Welcome to IkejaElectricity</h2>
  <p>Pay electricity bills using Pi Network</p>
  <button id="connectBtn" onclick="connectPi()">Connect Pi Wallet</button>

  <script>
    const piWallet = new PiWallet({
      appUrl: "https://ikejaelectricity-app.netlify.app/" // your Netlify URL
    });

    async function connectPi() {
      const btn = document.getElementById('connectBtn');
      btn.disabled = true;
      btn.textContent = 'Connecting...';

      try {
        const userData = await piWallet.request();
        if (userData) {
          btn.textContent = `Connected: ${userData.username}`;
        } else {
          btn.disabled = false;
          btn.textContent = 'Connect Pi Wallet';
          alert('Connection failed. Try again.');
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Connect Pi Wallet';
        alert('Error: ' + err.message);
      }
    }
  </script>
</body>
</html>
