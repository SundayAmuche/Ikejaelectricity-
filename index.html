<!DOCTYPE html>
<html>
<head>
  <title>IkejaElectricity App</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background-color: #f4f6f8;
    }

    h1 {
      color: #2c3e50;
    }

    h2 {
      color: #34495e;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      border-radius: 5px;
    }

    input {
      padding: 10px;
      width: 250px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    #walletStatus {
      color: green;
      font-weight: bold;
    }
  </style>

</head>
<body>

  <h1>Connect your Pi Wallet to continue</h1>

  <button onclick="connectWallet()">Connect Pi Wallet</button>

  <p id="walletStatus"></p>

  <h2>Enter your details</h2>

  <input type="text" id="name" placeholder="Enter your name"><br><br>

  <input type="text" id="meter" placeholder="Enter your meter number"><br><br>

  <button onclick="submitDetails()">Submit</button>

  <script>
    function connectWallet() {
      document.getElementById("walletStatus").innerText =
        "Pi Wallet connected successfully!";
    }

    function submitDetails() {
      let name = document.getElementById("name").value;
      let meter = document.getElementById("meter").value;

      alert("Name: " + name + "\nMeter Number: " + meter);
    }
  </script>

</body>
</html>
