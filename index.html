<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IkejaElectricity</title>
  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f2f2f2;
    }
    h2 {
      color: #4b0082;
    }
    button {
      background-color: #4b0082;
      color: white;
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #6a0dad;
    }
  </style>
</head>
<body>
  <h2>Welcome to IkejaElectricity</h2>
  <p>Pay electricity bills using Pi Network</p>
  <button id="connectBtn">Connect Pi Wallet</button>
  <p><small>Your live app URL: <a href="https://loquacious-daifuku-810be2.netlify.app" target="_blank">Netlify Link</a></small></p>

  <script>
    const connectBtn = document.getElementById("connectBtn");

    connectBtn.addEventListener("click", async () => {
      if (window.Pi) {
        try {
          await window.Pi.request({ method: "connect" });
          alert("Pi Wallet Connected ✅");
        } catch (err) {
          alert("Connection failed ❌");
          console.error(err);
        }
      } else {
        alert("Please open this link in Pi Browser ⚠️");
      }
    });
  </script>
</body>
</html>
