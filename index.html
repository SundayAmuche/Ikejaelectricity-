<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IkejaElectricity</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #333;
      text-align: center;
    }

    h2 {
      color: #555;
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 6px;
      transition: background-color 0.3s, transform 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }

    #walletStatus {
      margin-top: 20px;
      font-weight: bold;
      color: green;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #walletStatus.show {
      opacity: 1;
      transform: translateY(0);
    }

    form {
      margin-top: 30px;
      display: none;
      flex-direction: column;
      gap: 15px;
      max-width: 300px;
      width: 100%;
      align-items: center;
    }

    input {
      padding: 10px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 100%;
    }

    #submitBtn {
      background-color: #28a745;
    }

    #submitBtn:hover {
      background-color: #1e7e34;
    }
  </style>
</head>
<body>
  <h1>WELCOME TO IKEJAELECTRICITY</h1>
  <h2>Connect your Pi Wallet</h2>
  <button id="connectBtn">Connect Pi Wallet</button>

  <div id="walletStatus">Done successfully!</div>

  <form id="detailsForm">
    <input type="text" placeholder="Full Name" required>
    <input type="text" placeholder="Meter Number" required>
    <input type="number" placeholder="Amount (Pi)" required>
    <input type="email" placeholder="Email (optional)">
    <input type="tel" placeholder="Phone Number (optional)">
    <button type="submit" id="submitBtn">Submit / Pay</button>
  </form>

  <script>
    const connectBtn = document.getElementById('connectBtn');
    const walletStatus = document.getElementById('walletStatus');
    const detailsForm = document.getElementById('detailsForm');

    connectBtn.addEventListener('click', () => {
      // Show wallet success message with animation
      walletStatus.classList.add('show');

      // Show form after animation
      setTimeout(() => {
        detailsForm.style.display = 'flex';
      }, 600); // matches CSS transition time
    });
  </script>
</body>
</html>
