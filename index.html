<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IkejaElectricity</title>
  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
    button { 
      background-color: purple; color: white; padding: 15px 30px; 
      font-size: 18px; border: none; border-radius: 8px; cursor: pointer; 
    }
    button:disabled { background-color: gray; cursor: not-allowed; }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Welcome to IkejaElectricity</h2>
  <p>Pay electricity bills using Pi Network</p>

  <button id="connectBtn">Connect Pi Wallet</button>
  <div id="status"></div>

  <script>
    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');

    // Check if Pi object is available
    if (!window.Pi) {
      statusDiv.textContent = "Pi SDK not loaded or not in Pi Browser.";
      connectBtn.disabled = true;
    }

    async function connectPi() {
      try {
        const userData = await Pi.connect({ 
          // Optional: you can request user details here
          // appName: "IkejaElectricity"
        });

        if (userData) {
          statusDiv.textContent = `Connected as ${userData.username}`;
          connectBtn.disabled = true;
        } else {
          statusDiv.textContent = "Connection failed. Try again.";
        }
      } catch (err) {
        console.error(err);
        statusDiv.textContent = "Connection failed. Make sure you are in Pi Browser.";
      }
    }

    connectBtn.addEventListener('click', connectPi);
  </script>

</body>
</html>
