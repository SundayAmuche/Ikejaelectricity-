<!DOCTYPE html>
<html>
<head>
  <title>IkejaElectricity</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    .box {
      max-width: 400px;
      margin: 60px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      color: #222;
    }

    h3 {
      color: #555;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #6c4cff;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    #status {
      margin-top: 10px;
      color: green;
      font-weight: bold;
    }

    #form {
      display: none;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Connect your Pi Wallet to continue</h2>

  <button onclick="connect()">Connect Pi Wallet</button>

  <div id="status"></div>

  <div id="form">
    <h3>Enter your details</h3>

    <input type="text" placeholder="Full Name">
    <input type="text" placeholder="Meter Number">

    <button>Submit / Pay</button>
  </div>
</div>

<script>
  function connect() {
    document.getElementById("status").innerHTML = "Pi Wallet connected successfully!";
    document.getElementById("form").style.display = "block";
  }
</script>

</body>
</html>
