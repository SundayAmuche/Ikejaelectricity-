<!DOCTYPE html>
<html>
<head>
  <title>IkejaElectricity App</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background-color: #f2f2f2;
    }

    h2 {
      color: #0a7cff;
    }

    button {
      padding: 10px 20px;
      background-color: green;
      color: white;
      border: none;
      border-radius: 5px;
      margin: 10px;
      cursor: pointer;
    }

    input {
      padding: 10px;
      margin: 10px;
      width: 80%;
      max-width: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .container {
      background: white;
      padding: 20px;
      margin: 50px auto;
      width: 90%;
      max-width: 400px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Connect your Pi Wallet to continue</h2>

  <button onclick="connectWallet()">Connect Pi Wallet</button>

  <p id="status"></p>

  <div id="formSection" style="display:none;">
    <h3>Enter your details</h3>

    <input type="text" placeholder="Full Name"><br>
    <input type="text" placeholder="Meter Number"><br>

    <button>Submit / Pay</button>
  </div>

</div>

<script>
  function connectWallet() {
    document.getElementById("status").innerHTML = "Pi Wallet connected successfully!";
    document.getElementById("formSection").style.display = "block";
  }
</script>

</body>
</html>
