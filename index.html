<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IkejaElectricity</title>

  <!-- Favicon -->
  <link rel="icon" href="https://i.imgur.com/2yX9u1V.png" type="image/png">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: linear-gradient(135deg, #f0f8ff, #e6f7ff);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      color: #333;
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 1s ease-in-out, transform 1s ease-in-out;
    }

    h2 {
      color: #555;
      margin-top: 20px;
    }

    button {
      padding: 10px 25px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 8px;
      transition: all 0.3s;
      margin-top: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    button:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }

    #walletStatus {
      margin-top: 20px;
      font-weight: bold;
      color: green;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #walletStatus.show {
      opacity: 1;
      transform: translateY(0);
    }

    form {
      margin-top: 30px;
      display: none;
      flex-direction: column;
      gap: 15px;
      max-width: 300px;
      width: 100%;
      align-items: center;
    }

    input {
      padding: 10px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 100%;
    }

    #submitBtn {
      background-color: #28a745;
    }

    #submitBtn:hover {
      background-color: #1e7e34;
    }
  </style>
</head>
<body>
  <h1 id="mainTitle">WELCOME TO IKEJAELECTRICITY</h1>
  <h2>Connect your Pi Wallet</h2>
  <button id="connectBtn">Connect Pi Wallet</button>

  <div id="walletStatus">Done successfully!</div>

  <form id="detailsForm">
    <input type="text" placeholder="Full Name" required>
    <input type="text" placeholder="Meter Number" required>
    <input type="number" placeholder="Amount (Pi)" required>
    <input type="email" placeholder="Email (optional)">
    <input type="tel" placeholder="Phone Number (optional)">
    <button type="submit" id="submitBtn">Submit / Pay</button>
  </form>

  <script>
    // Page load animation for title
    window.addEventListener('load', () => {
      const title = document.getElementById('mainTitle');
      setTimeout(() => {
        title.style.opacity = 1;
        title.style.transform = "translateY(0)";
      }, 100);
    });

    // Wallet connect animation
    const connectBtn = document.getElementById('connectBtn');
    const walletStatus = document.getElementById('walletStatus');
    const detailsForm = document.getElementById('detailsForm');

    connectBtn.addEventListener('click', () => {
      walletStatus.classList.add('show');
      setTimeout(() => {
        detailsForm.style.display = 'flex';
      }, 600);
    });
  </script>
</body>
</html>
