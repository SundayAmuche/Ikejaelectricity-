Html

<button id="connectPi">Connect Pi Wallet</button>

<script>
  // Replace these with your Pi Developer Portal values
  const clientId = "YOUR_CLIENT_ID_HERE";
  const redirectUri = "YOUR_REDIRECT_URI_HERE"; // must exactly match portal

  document.getElementById("connectPi").onclick = () => {
    const authUrl = `https://wallet.minepi.com/authorize?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code&scope=pi`;
    // Redirect to Pi Wallet login
    window.location.href = authUrl;
  };
</script>
