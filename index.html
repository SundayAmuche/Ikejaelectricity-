<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IkejaElectricity</title>

  <!-- ✅ Pi SDK must be here -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background:#0c1b2a;
      color:white;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:400px;
    }

    button{
      background:#2d8cff;
      color:white;
      border:none;
      padding:14px;
      width:100%;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:none;
      border-radius:6px;
    }

    #successMessage{
      display:none;
      margin-top:15px;
      background:green;
      padding:10px;
      border-radius:8px;
    }

    #formSection{
      display:none;
      margin-top:15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>WELCOME TO IKEJAELECTRICITY</h1>
  <p>Connect your Pi Wallet to continue</p>

  <button onclick="connectWallet()">Connect Pi Wallet</button>

  <div id="successMessage">Pi Wallet connected successfully!</div>

  <div id="formSection">
    <input type="text" id="meterNumber" placeholder="Meter Number">
    <input type="number" id="amount" placeholder="Amount">
    <button onclick="submitForm()">Submit</button>
  </div>

</div>

<!-- ✅ JS goes at bottom -->
<script>
let PiReady = false;

document.addEventListener("DOMContentLoaded", function () {
  const waitForPi = setInterval(() => {

    if (window.Pi) {
      clearInterval(waitForPi);

      Pi.init({ version: "2.0", sandbox: false });

      PiReady = true;
      console.log("Pi SDK fully initialized");
    }

  }, 300);
});

async function connectWallet() {
  try {

    if (!window.Pi || !PiReady) {
      alert("Open inside Pi Browser");
      return;
    }

    const scopes = ["username", "payments"];

    const authResult = await Pi.authenticate(scopes, onIncompletePaymentFound);

    console.log(authResult.user);

    document.getElementById("successMessage").style.display = "block";
    document.getElementById("formSection").style.display = "block";

  } catch (error) {
    console.error(error);
  }
}

function onIncompletePaymentFound(payment) {
  console.log(payment);
}

function submitForm() {
  const meter = document.getElementById("meterNumber").value;
  const amount = document.getElementById("amount").value;

  if (!meter || !amount) {
    alert("Please fill all fields");
    return;
  }

  alert("Form submitted successfully");
}
</script>

</body>
</html>
