<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IkejaElectricity</title>

  <!-- Pi SDK -->
  <script src="https://sandbox.minepi.com/pi.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    button {
      background-color: #8A2BE2;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <h2>Welcome to IkejaElectricity</h2>
  <p>Pay electricity bills using Pi Network</p>

  <button id="connectBtn" onclick="connectPi()">Connect Pi Wallet</button>

  <script>
    async function connectPi() {
      const btn = document.getElementById('connectBtn');
      btn.disabled = true;
      btn.textContent = 'Connecting...';

      try {
        // Initialize Pi SDK
        Pi.init({ version: "2.0", sandbox: true });

        // Authenticate user
        const user = await Pi.authenticate(['username']);

        if (user) {
          btn.textContent = "Connected: " + user.user.username;
        } else {
          btn.disabled = false;
          btn.textContent = 'Connect Pi Wallet';
          alert('Connection failed');
        }

      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Connect Pi Wallet';
        alert('Error: ' + err.message);
      }
    }
  </script>
</body>
</html>
