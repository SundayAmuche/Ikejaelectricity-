<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IkejaElectricity</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#0c1b2a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:400px;
    }

    button{
      width:100%;
      padding:14px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      background:#2d8cff;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:none;
      border-radius:6px;
    }

    #formSection{
      display:none;
      margin-top:15px;
    }

    #successMessage{
      display:none;
      margin-top:15px;
      background:green;
      padding:10px;
      border-radius:8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>WELCOME TO IKEJAELECTRICITY</h1>
<p>Connect your Pi Wallet to continue</p>

<button onclick="connectWallet()">
  Connect Pi Wallet
</button>

<br><br>

<button onclick="makePayment()">
  Pay with Pi
</button>

<p id="usernameDisplay"></p>

<div id="formSection">
  <input type="text" id="meterNumber" placeholder="Meter Number">
  <input type="number" id="amount" placeholder="Amount">
  <button onclick="submitForm()">Submit</button>
</div>

<div id="successMessage">
  Pi Wallet connected successfully!
</div>

<a href="/validation-key.txt" target="_blank" style="color:#00c3ff; display:block; margin-top:20px;">
  View Validation Key
</a>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  if (window.Pi) {
    Pi.init({ version: "2.0" });
    console.log("Pi SDK loaded");
  }
});
async function connectWallet() {
  
  try {

    if (!window.Pi) {
      
      alert("Pi SDK not available");
      return;
    }
    
    const scopes = ["username", "payments"];
    
    const authResult = await Pi.authenticate(
      scopes,
      onIncompletePaymentFound
    );

    console.log(authResult.user);
    document.getElementById("usernameDisplay").innerText =
  "Logged in as: " + authResult.user.username;

    document.getElementById("successMessage").style.display = "block";
    document.getElementById("formSection").style.display = "block";

  } catch (error) {
    console.error(error);
    alert("Connection failed");
  }
}

function onIncompletePaymentFound(payment) {
  console.log(payment);
}

function submitForm() {
  const meter = document.getElementById("meterNumber").value;
  const amount = document.getElementById("amount").value;

  if (!meter || !amount) {
    alert("Please fill all fields");
    return;
  }

  alert("Form submitted successfully");
}
  function onIncompletePaymentFound(payment) {
  console.log("Incomplete payment found:", payment);
}
<script>
function onIncompletePaymentFound(payment) {
  console.log("Incomplete payment found:", payment);
  // Optional: handle resuming incomplete payments here
}

async function makePayment() {
  try {
    if (!window.Pi) {
      alert("Open inside Pi Browser");
      return;
    }

    const scopes = ["username", "payments"];
    await Pi.authenticate(scopes, onIncompletePaymentFound);

    const paymentData = {
      amount: 1,
      memo: "IkejaElectricity Token Payment",
      metadata: { service: "electricity" }
    };

    const paymentCallbacks = {
      onReadyForServerApproval: function(paymentId) {
        console.log("Approval step:", paymentId);
        fetch("https://ikejaelectricity.vercel.app/api/approve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ payment: { identifier: paymentId } })
        }).catch(err => console.error(err));
        alert("Payment sent for approval");
      },
      onReadyForServerCompletion: function(paymentId, txid) {
        console.log("Completion step:", paymentId, txid);
        fetch("https://ikejaelectricity.vercel.app/api/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ payment: { identifier: paymentId, txid: txid } })
        }).catch(err => console.error(err));
        alert("Payment completed successfully");
      },
      onCancel: function() { alert("Payment cancelled"); },
      onError: function(error) { console.error(error); alert("Payment error"); }
    };

    await Pi.createPayment(paymentData, paymentCallbacks, { serverSide: true });

  } catch (err) {
    console.error(err);
    alert("Payment failed");
  }
}
</script>

</body>
</html>
