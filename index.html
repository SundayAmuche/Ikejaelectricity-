<!DOCTYPE html>
<html>
<head>
  <title>IkejaElectricity App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f2f2f2;
      padding: 20px;
    }

    h1 {
      color: #6a0dad;
    }

    input {
      padding: 10px;
      margin: 10px;
      width: 80%;
      max-width: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .form-box {
      margin-top: 20px;
    }

    button {
      appearance: none;           /* Remove default browser/Pi styling */
      -webkit-appearance: none;   /* Remove iOS/Android default styling */
      background-color: #6a0dad !important; /* Force purple */
      color: white !important;    /* Force white text */
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Connect your Pi Wallet to continue</h1>

  <button onclick="connectWallet()">Connect Pi Wallet</button>

  <p id="status"></p>

  <div class="form-box">
    <h2>Enter your details</h2>

    <input type="text" id="name" placeholder="Enter your name"><br>
    <input type="text" id="meter" placeholder="Enter your meter number"><br>

    <button onclick="submitDetails()">Submit</button>
  </div>

  <script>
    function connectWallet() {
      document.getElementById("status").innerHTML = "Pi Wallet connected successfully!";
    }

    function submitDetails() {
      const name = document.getElementById("name").value;
      const meter = document.getElementById("meter").value;
      if(name && meter){
        alert(`Name: ${name}\nMeter Number: ${meter}\nDetails submitted successfully!`);
      } else {
        alert("Please enter both name and meter number.");
      }
    }
  </script>

</body>
</html>
