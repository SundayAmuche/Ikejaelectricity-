<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IkejaElectricity</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
  body { font-family: sans-serif; text-align: center; padding: 50px; }
  button { padding: 15px 30px; margin: 10px; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
<h1>WELCOME TO IKEJAELECTRICITY</h1>
<p>Connect your Pi Wallet to continue</p>

<button id="connectBtn">Connect Pi Wallet</button>
<button id="payBtn">Pay with Pi</button>

<p><a href="https://ikejaelectricity.vercel.app/validation-key.txt" target="_blank">View Validation Key</a></p>

<script>
document.addEventListener("DOMContentLoaded", function () {
  if (!window.Pi) {
    alert("Please open this in the Pi Browser!");
    return;
  }

  const connectBtn = document.getElementById("connectBtn");
  const payBtn = document.getElementById("payBtn");

  connectBtn.addEventListener("click", async () => {
    try {
      const scopes = ["username", "payments"];
      const result = await Pi.authenticate(scopes);
      alert("Connected as: " + result.username);
    } catch (err) {
      console.error(err);
      alert("Wallet connection failed");
    }
  });

  payBtn.addEventListener("click", async () => {
    try {
      const paymentResult = await Pi.requestPayment({
        amount: "1",
        memo: "Test Payment"
      });
      alert("Payment status: " + paymentResult.status);
    } catch (err) {
      console.error(err);
      alert("Payment failed");
    }
  });
});
</script>
</body>
</html>
