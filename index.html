<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IkejaElectricity App</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        #connectButton { padding: 10px 20px; font-size: 18px; cursor: pointer; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>IkejaElectricity App</h1>
    <p>Connect your Pi Wallet to continue</p>
    <button id="connectButton" disabled>Connect Pi Wallet</button>
    <div id="status">Checking Pi Wallet...</div>

    <script>
        // Wait until Pi object is available
        const status = document.getElementById('status');
        const button = document.getElementById('connectButton');

        function detectPiWallet() {
            if (window.Pi && window.Pi.getUserAccount) {
                status.textContent = "Pi Wallet detected!";
                button.disabled = false;

                button.addEventListener('click', async () => {
                    try {
                        const account = await window.Pi.getUserAccount();
                        status.textContent = `Wallet connected: ${account.address}`;
                    } catch (err) {
                        status.textContent = "Connection failed. Try again.";
                        console.error(err);
                    }
                });
            } else {
                status.textContent = "Pi Wallet not detected. Make sure you're in Pi Browser.";
            }
        }

        // Retry detection every 500ms until Pi object is ready
        const interval = setInterval(() => {
            if (window.Pi) {
                clearInterval(interval);
                detectPiWallet();
            }
        }, 500);
    </script>
</body>
</html>
