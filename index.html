!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IkejaElectricity</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #f5f5f5;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }
    #status {
      margin-top: 20px;
      font-weight: bold;
      color: green;
      white-space: pre-line; /* This ensures \n creates a line break */
    }
  </style>
</head>
<body>

  <h1>WELCOME TO IKEJAELECTRICITY</h1>
  <h2>Connect your Pi Wallet to continue</h2>
  
  <button id="connectBtn">Connect Pi Wallet</button>
  
  <div id="status"></div> <!-- Initially empty -->

  <script>
    const button = document.getElementById('connectBtn');
    const status = document.getElementById('status');

    button.addEventListener('click', async () => {
      try {
        status.innerText = "Connecting to Pi Wallet...";

        // Simulate connection delay
        await new Promise(resolve => setTimeout(resolve, 1500));

        // Show message on two lines
        status.innerText = "Wallet Connected\nPi Wallet connected successfully!";
      } catch (err) {
        status.innerText = "Failed to connect Pi Wallet.";
        console.error(err);
      }
    });
  </script>

</body>
</html>
