<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IkejaElectricity</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      padding: 20px;
    }
    h1 { margin-bottom: 10px; }
    h2 { margin-bottom: 30px; font-weight: normal; color: #333; }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
    }
    .message {
      margin-top: 20px;
      color: white;
      background-color: #4CAF50;
      padding: 10px;
      border-radius: 5px;
      display: none;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
    }
    .fade-in {
      display: block;
      opacity: 1;
    }
    .input-field {
      display: block;
      margin: 10px auto;
      padding: 8px;
      width: 80%;
      max-width: 300px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>WELCOME TO IKEJAELECTRICITY</h1>
  <h2>Connect your Pi Wallet to continue</h2>

  <button id="connectBtn">Connect Pi Wallet</button>

  <div id="walletMessage" class="message">
    Wallet Connected<br>Pi Wallet connected successfully!
  </div>

  <div id="formFields" style="display:none;">
    <input type="text" class="input-field" placeholder="Full Name" id="fullName">
    <input type="text" class="input-field" placeholder="Meter Number" id="meterNumber">
    <input type="number" class="input-field" placeholder="Amount (Pi)" id="amount">
    <button id="submitBtn">Submit / Pay</button>
  </div>

  <script>
    const connectBtn = document.getElementById('connectBtn');
    const walletMessage = document.getElementById('walletMessage');
    const formFields = document.getElementById('formFields');

    connectBtn.addEventListener('click', () => {
      walletMessage.classList.add('fade-in'); // show message with fade
      connectBtn.disabled = true;
      connectBtn.textContent = 'Wallet Connected';
      formFields.style.display = 'block'; // show input fields
    });

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.addEventListener('click', () => {
      const name = document.getElementById('fullName').value;
      const meter = document.getElementById('meterNumber').value;
      const amount = document.getElementById('amount').value;

      if(!name || !meter || !amount) {
        alert('Please fill in all fields');
        return;
      }
      alert(`Payment Submitted!\nName: ${name}\nMeter: ${meter}\nAmount: ${amount} Pi`);
      // Here you can add Pi transaction code
    });
  </script>
</body>
</html>
