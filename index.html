<script src="https://sandbox.minepi.com/pi.js"></script>

<script>
  async function connectPi() {
    const btn = document.getElementById('connectBtn');
    btn.disabled = true;
    btn.textContent = 'Connecting...';

    try {
      // Initialize Pi SDK
      Pi.init({ version: "2.0", sandbox: true });

      // Request user connection
      const user = await Pi.authenticate(['username']);

      if (user) {
        btn.textContent = "Connected: " + user.user.username;
      } else {
        btn.disabled = false;
        btn.textContent = 'Connect Pi Wallet';
        alert('Connection failed');
      }

    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Connect Pi Wallet';
      alert('Error: ' + err.message);
    }
  }
</script>
