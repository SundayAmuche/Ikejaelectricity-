!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IkejaElectricity</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-top: 40px;
    }

    button {
      padding: 12px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0056b3;
    }

    .success {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #28a745;
      color: white;
      border-radius: 5px;
      animation: slideDown 0.5s ease;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .form {
      display: none;
      margin-top: 20px;
    }

    input {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 80%;
      max-width: 300px;
    }
  </style>
</head>

<body>

  <h1>WELCOME TO IKEJAELECTRICITY</h1>
  <h3>Connect your Pi Wallet to continue</h3>

  <button onclick="connectWallet()">Connect Pi Wallet</button>

  <!-- SUCCESS MESSAGE -->
  <div class="success" id="successMsg">
    <h3 style="margin:0;">Wallet Connected</h3>
    <p style="margin:5px 0 0;">Pi Wallet connected successfully!</p>
  </div>

  <!-- FORM -->
  <div class="form" id="formSection">
    <h3>Enter your details</h3>

    <input type="text" placeholder="Full Name" required>
    <input type="text" placeholder="Meter Number" required>
    <input type="number" placeholder="Amount (Pi)" required>
    <input type="email" placeholder="Email (optional)">
    <input type="tel" placeholder="Phone (optional)">

    <br>
    <button onclick="makePayment()">Submit / Pay</button>
  </div>

  <script>
    // CONNECT WALLET
    async function connectWallet() {
      try {
        Pi.init({ version: "2.0" });

        const scopes = ['username', 'payments'];

        const auth = await Pi.authenticate(scopes, function(payment) {
          console.log("Payment ready", payment);
        });

        console.log("Authenticated user:", auth);

        document.getElementById("successMsg").style.display = "block";
        document.getElementById("formSection").style.display = "block";

      } catch (error) {
        alert("❌ Failed. Open this inside Pi Browser.");
        console.error(error);
      }
    }

    // MAKE PAYMENT
    function makePayment() {
      const amount = document.querySelector('input[type="number"]').value;

      if (!amount) {
        alert("Enter amount");
        return;
      }

      Pi.createPayment({
        amount: Number(amount),
        memo: "Electricity Payment",
        metadata: { type: "ikejaelectricity" }
      }, {
        onReadyForServerApproval: function(paymentId) {
          console.log("Ready for approval:", paymentId);
        },
        onReadyForServerCompletion: function(paymentId, txid) {
          console.log("Payment completed:", paymentId, txid);
          alert("✅ Payment successful!");
        },
        onCancel: function(paymentId) {
          alert("❌ Payment cancelled");
        },
        onError: function(error, payment) {
          console.error("Payment error:", error);
        }
      });
    }
  </script>

</body>
</html>
