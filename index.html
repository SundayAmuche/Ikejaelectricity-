<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IkejaElectricity App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <h1>IkejaElectricity App</h1>
  <p>Connect your Pi Wallet to continue</p>
  <button id="connectWalletBtn">Connect Pi Wallet</button>

  <script>
    const connectBtn = document.getElementById('connectWalletBtn');

    connectBtn.addEventListener('click', async () => {
      if (window.Pi) {
        try {
          const userData = await window.Pi.request({ method: 'getUserData' });
          alert('Wallet connected: ' + userData.username);
        } catch (error) {
          alert('Connection failed: ' + error.message);
        }
      } else {
        alert('Pi Wallet not detected. Please open in Pi Browser.');
      }
    });
  </script>

</body>
</html>
