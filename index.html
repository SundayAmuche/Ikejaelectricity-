<script src="https://sandbox.minepi.com/pi.js"></script>

<script>
  const piWallet = new PiWallet({
    appUrl: "https://ikejaelectricity-app.netlify.app/" // your Netlify URL
  });

  async function connectPi() {
    const btn = document.getElementById('connectBtn');
    btn.disabled = true;
    btn.textContent = 'Connecting...';

    try {
      const userData = await piWallet.request();
      if (userData) {
        btn.textContent = `Connected: ${userData.username}`;
      } else {
        btn.disabled = false;
        btn.textContent = 'Connect Pi Wallet';
        alert('Connection failed. Try again.');
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Connect Pi Wallet';
      alert('Error: ' + err.message);
    }
  }
</script>
