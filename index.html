<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IkejaElectricity</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: purple !important;
      font-size: 2.5em;
      margin-bottom: 20px;
    }
    h2 {
      color: purple !important;
      font-size: 1.8em;
      margin-bottom: 15px;
    }
    h3 {
      color: purple !important;
      font-size: 1.5em;
      margin-top: 30px;
      margin-bottom: 15px;
    }
    p {
      font-size: 1.2em;
      color: #333;
      margin-bottom: 20px;
      display: none; /* hide initially */
    }
    input[type="text"] {
      padding: 10px;
      width: 250px;
      margin: 5px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1em;
    }
    input[type="submit"], button {
      background-color: purple !important;
      color: white !important;
      border: none;
      padding: 12px 25px;
      font-size: 1em;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    input[type="submit"]:hover, button:hover {
      background-color: #5e0080 !important;
    }
  </style>
</head>
<body>
  <h1>WELCOME TO IKEJAELECTRICITY</h1>
  <h2>Connect your Pi Wallet to continue</h2>
  <button id="connectBtn">Connect Pi Wallet</button>
  <p id="successMsg">Pi Wallet connected successfully!</p>
  
  <h3>Enter your details</h3>
  <input type="text" placeholder="Name" />
  <input type="text" placeholder="Meter Number" />
  <br>
  <input type="submit" value="Submit / Pay" />

  <script>
    const connectBtn = document.getElementById('connectBtn');
    const successMsg = document.getElementById('successMsg');

    connectBtn.addEventListener('click', () => {
      successMsg.style.display = 'block'; // show message when clicked
      connectBtn.disabled = true;          // optionally disable button after connection
      connectBtn.textContent = 'Wallet Connected';
    });
  </script>
</body>
</html>
