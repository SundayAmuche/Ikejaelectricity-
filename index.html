<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IkejaElectricity</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 50px;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      margin: auto;
    }

    h1 {
      color: #2c3e50;
    }

    p {
      font-size: 18px;
      margin: 20px 0;
    }

    button {
      background: #6c5ce7;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #5a4bd6;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Welcome to IkejaElectricity</h1>
    <p>Pay electricity bills using Pi Network.</p>
    <button onclick="connectWallet()">Connect Pi Wallet</button>
  </div>

  <!-- Pi SDK -->
  <script src="https://cdn.minepi.com/pi-sdk/pi-sdk.js"></script>
  <script>
    async function connectWallet() {
      try {
        // Initialize Pi SDK
        await Pi.init({
          appId: 'GB3H2...3IAEH', // ← Replace with your full App ID
          appName: 'IkejaElectricityApp',
          sandbox: false           // false for live users
        });

        // Connect Pi Wallet
        const connected = await Pi.connect();
        if (connected) {
          alert('Pi Wallet connected successfully!');
        } else {
          alert('Connection failed');
        }

      } catch (err) {
        alert('Connection error: ' + err.message);
      }
    }
  </script>

</body>

</html>
