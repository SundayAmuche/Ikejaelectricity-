<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IkejaElectricity</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>

<body style="text-align:center; font-family: Arial; margin-top:50px;">

  <h2>Welcome to IkejaElectricity</h2>
  <p>Pay electricity bills using Pi Network.</p>

  <button onclick="connectPi()" style="padding:10px 20px; font-size:16px; background:purple; color:white; border:none; border-radius:5px;">
    Connect Pi Wallet
  </button>

  <script>
    // Initialize Pi SDK (NO version error)
    Pi.init({ sandbox: true });

    async function connectPi() {
      try {
        const scopes = ['username', 'payments'];

        const auth = await Pi.authenticate(scopes, function(payment) {
          console.log("Payment data:", payment);
        });

        alert("Connected as: " + auth.user.username);

      } catch (error) {
        console.error(error);
        alert("Connection failed");
      }
    }
  </script>

</body>
</html>
