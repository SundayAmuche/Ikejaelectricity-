<!DOCTYPE html>
<html>
<head>
    <title>IkejaElectricity App</title>

    <style>
        body {
            background-color: #0b1f3a; /* dark blue */
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #00d4ff; /* light blue */
        }

        h2 {
            color: #00ff88; /* green */
        }

        h3 {
            color: #ffd700; /* gold */
        }

        form {
            margin-top: 20px;
        }

        input {
            padding: 10px;
            width: 80%;
            max-width: 300px;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
        }

        button {
            padding: 12px 20px;
            background-color: #00ff88;
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #00cc6a;
        }
    </style>

</head>

<body>

<h1>WELCOME TO IKEJAELECTRICITY</h1>

<h2>Connect your Pi Wallet to continue</h2>

<p><strong>Wallet Connected</strong></p>
<p>Pi Wallet connected successfully!</p>

<h3>Enter your details</h3>

<form>

    <label>Full Name:</label><br>
    <input type="text" placeholder="Enter your full name"><br><br>

    <label>Meter Number:</label><br>
    <input type="text" placeholder="Enter your meter number"><br><br>

    <label>Amount (Pi):</label><br>
    <input type="number" placeholder="Enter amount"><br><br>

    <button type="submit">Submit / Pay</button>

</form>

</body>
</html>
