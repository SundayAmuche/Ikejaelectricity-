<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IkejaElectricity</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>

<body style="text-align:center; font-family:Arial;">

  <h2>Welcome to IkejaElectricity</h2>
  <p>Pay electricity bills using Pi Network</p>

  <button onclick="connectPi()" 
          style="padding:15px; background-color:purple; color:white; border:none; border-radius:10px;">
    Connect Pi Wallet
  </button>

  <p id="status"></p>

  <script>
    async function connectPi() {
      try {
        // Initialize Pi
        Pi.init({ version: "2.0" });

        // Authenticate user
        const auth = await Pi.authenticate(["username", "payments"], function(payment) {
          console.log(payment);
        });

        document.getElementById("status").innerText = "Connected: " + auth.user.username;

      } catch (error) {
        document.getElementById("status").innerText = "Connection failed";
        console.log(error);
      }
    }
  </script>

</body>
</html>
