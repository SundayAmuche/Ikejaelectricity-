<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IkejaElectricity</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background:#0c1b2a;
      color:white;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:400px;
      animation:fadeIn 1s ease;
    }

    h1{
      font-size:28px;
      margin-bottom:15px;
    }

    h3{
      font-size:16px;
      font-weight:normal;
      color:#cfd8dc;
      margin-bottom:30px;
    }

    button{
      background:#2d8cff;
      color:white;
      border:none;
      padding:14px 24px;
      font-size:16px;
      border-radius:10px;
      cursor:pointer;
      width:100%;
      font-weight:bold;
      margin-top:10px;
    }

    #successMessage{
      display:none;
      margin-top:20px;
      background:#00b894;
      padding:12px;
      border-radius:8px;
    }

    #formSection{
      display:none;
      margin-top:20px;
    }

    input{
      width:100%;
      padding:10px;
      margin:10px 0;
      border-radius:6px;
      border:none;
    }

    a{
      display:inline-block;
      margin-top:25px;
      color:#00c3ff;
      text-decoration:none;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>WELCOME TO IKEJAELECTRICITY</h1>

    <h3>Connect your Pi Wallet to continue</h3>

    <button onclick="connectWallet()">
      Connect Pi Wallet
    </button>

    <div id="successMessage">
      Pi Wallet connected successfully!
    </div>

    <div id="formSection">

      <h3>Electricity Payment Form</h3>

      <input type="text" id="meterNumber" placeholder="Enter Meter Number" />

      <input type="number" id="amount" placeholder="Enter Amount" />

      <button onclick="submitForm()">
        Submit
      </button>

    </div>

    <a href="/validation-key.txt" target="_blank">
      View Validation Key
    </a>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      Pi.init({ version: "2.0" });

    });
    alert("Button clicked");

    async function connectWallet() {

      try {

        if (!window.Pi) {
          alert("Open inside Pi Browser");
          return;
        }

        const scopes = ['username', 'payments'];

        const authResult = await Pi.authenticate(
          scopes,
          onIncompletePaymentFound
        );

        document.getElementById("successMessage").style.display = "block";

        document.getElementById("formSection").style.display = "block";

        console.log(authResult.user);

      } catch (error) {

        console.error(error);

        alert("Pi Wallet connection failed");

      }
    }

    function onIncompletePaymentFound(payment) {
      console.log(payment);
    }

    function submitForm() {

      const meter = document.getElementById("meterNumber").value;

      const amount = document.getElementById("amount").value;

      if (!meter || !amount) {

        alert("Please fill all fields");

        return;
      }

      alert("Form submitted successfully");

    }
  <script>
  let PiReady = false;

  document.addEventListener("DOMContentLoaded", async function () {
    try {
      if (window.Pi) {
        await Pi.init({ version: "2.0" });
        PiReady = true;
        console.log("Pi SDK initialized");
      } else {
        console.log("Pi SDK not found");
      }
    } catch (e) {
      console.error("Pi init error:", e);
    }
  });

  async function connectWallet() {
    try {
      if (!window.Pi || !PiReady) {
        alert("Open this app inside Pi Browser");
        return;
      }

      const scopes = ["username", "payments"];

      const authResult = await Pi.authenticate(scopes, onIncompletePaymentFound);

      console.log("User:", authResult.user);

      document.getElementById("successMessage").style.display = "block";
      document.getElementById("formSection").style.display = "block";

    } catch (error) {
      console.error("Wallet error:", error);
      alert("Pi Wallet connection failed");
    }
  }

  function onIncompletePaymentFound(payment) {
    console.log("Incomplete payment:", payment);
  }

  function submitForm() {
    const meter = document.getElementById("meterNumber").value;
    const amount = document.getElementById("amount").value;

    if (!meter || !amount) {
      alert("Please fill all fields");
      return;
    }

    alert("Form submitted successfully");
  }
</script>

</body>
</html>
