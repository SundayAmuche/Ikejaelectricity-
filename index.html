<!DOCTYPE html>
<html>
<head>
  <title>IkejaElectricity</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4 !important;
      text-align: center;
    }

    h1 {
      color: #4b00ff !important; /* Deep purple */
      font-size: 26px;
      margin-bottom: 10px;
    }

    h2 {
      color: #222 !important;
      font-size: 18px;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 20px;
      border-radius: 6px;
      background: #4b00ff !important; /* Deep purple */
      color: #fff !important;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin: 10px 0;
      width: 80%;
    }

    #status {
      color: #4b00ff !important; /* Purple instead of green */
      font-weight: bold;
      display: none; /* Hidden until connect */
      margin-bottom: 15px;
    }

    #form {
      display: none; /* Hidden until connect */
    }

    input {
      padding: 10px;
      width: 80%;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc !important;
    }
  </style>
</head>

<body>

  <h1>WELCOME TO IKEJAELECTRICITY</h1>
  <h2>Connect your Pi Wallet to continue</h2>

  <button onclick="connect()">Connect Pi Wallet</button>

  <p id="status">Pi Wallet connected successfully!</p>

  <div id="form">
    <h3>Enter your details</h3>
    <input type="text" placeholder="Full Name"><br>
    <input type="text" placeholder="Meter Number"><br>
    <button>Submit / Pay</button>
  </div>

  <script>
    function connect() {
      document.getElementById("status").style.display = "block";
      document.getElementById("form").style.display = "block";
    }
  </script>

</body>
</html>
