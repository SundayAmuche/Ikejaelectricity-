<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IkejaElectricity App</title>
</head>
<body style="font-family: Arial; text-align: center; padding-top: 50px;">

  <h1>Connect your Pi Wallet to continue</h1>
  <button onclick="connectWallet()">Connect Pi Wallet</button>

  <p id="status">Not connected</p>

  <!-- FORM -->
  <div id="form" style="display:none;">
    <h2>Enter your details</h2>

    <input type="text" id="username" placeholder="Enter Username"><br><br>
    <input type="text" id="meter" placeholder="Enter Meter Number"><br><br>

    <button onclick="submitDetails()">Submit</button>
  </div>

  <!-- RESULT -->
  <div id="result" style="display:none;">
    <h2>Welcome to IkejaElectricity</h2>
    <p>Username: <span id="showName"></span></p>
    <p>Meter Number: <span id="showMeter"></span></p>
  </div>

  <script>
    function connectWallet() {
      document.getElementById('status').innerText = 'Pi Wallet connected successfully!';
      document.getElementById('form').style.display = 'block';
    }

    function submitDetails() {
      const name = document.getElementById('username').value;
      const meter = document.getElementById('meter').value;

      if (!name || !meter) {
        alert('Please fill all fields');
        return;
      }

      document.getElementById('showName').innerText = name;
      document.getElementById('showMeter').innerText = meter;

      document.getElementById('form').style.display = 'none';
      document.getElementById('result').style.display = 'block';
    }
  </script>

</body>
</html
