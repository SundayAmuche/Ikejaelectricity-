<div class="container">

  <h1>WELCOME TO IKEJAELECTRICITY</h1>

  <h3>Connect your Pi Wallet to continue</h3>

  <button onclick="connectWallet()">
    Connect Pi Wallet
  </button>

  <div id="successMessage" style="display:none; margin-top:20px; background:#00b894; padding:12px; border-radius:8px;">
    Pi Wallet connected successfully!
  </div>

  <!-- FORM -->
  <div id="formSection" style="display:none; margin-top:20px;">

    <h3>Electricity Payment Form</h3>

    <input type="text" id="meterNumber" placeholder="Enter Meter Number"
      style="width:100%;padding:10px;margin:10px 0;border-radius:6px;border:none;" />

    <input type="number" id="amount" placeholder="Enter Amount"
      style="width:100%;padding:10px;margin:10px 0;border-radius:6px;border:none;" />

    <button onclick="submitForm()"
      style="background:#2d8cff;color:white;border:none;padding:12px;border-radius:8px;width:100%;">
      Submit
    </button>

  </div>

  <a href="/validation-key.txt" target="_blank">
    View Validation Key
  </a>

</div>
