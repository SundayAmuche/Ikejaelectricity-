<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IkejaElectricity</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#0c1b2a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:400px;
    }

    button{
      width:100%;
      padding:14px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      background:#2d8cff;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:none;
      border-radius:6px;
    }

    #formSection{
      display:none;
      margin-top:15px;
    }

    #successMessage{
      display:none;
      margin-top:15px;
      background:green;
      padding:10px;
      border-radius:8px;
    }
  </style>
</head>

<body>

<div class="container">

<h1>WELCOME TO IKEJAELECTRICITY</h1>
<p>Connect your Pi Wallet to continue</p>

<button onclick="connectWallet()">
  Connect Pi Wallet
</button>

<br><br>

<button onclick="makePayment()">
  Pay with Pi
</button>

<p id="usernameDisplay"></p

<div id="formSection">
  <input type="text" id="meterNumber" placeholder="Meter Number">
  <input type="number" id="amount" placeholder="Amount">
  <button onclick="submitForm()">Submit</button>
</div>

<div id="successMessage">
  Pi Wallet connected successfully!
</div>

<a href="/validation-key.txt" target="_blank" style="color:#00c3ff; display:block; margin-top:20px;">
  View Validation Key
</a>

</div>

  <script>
document.addEventListener("DOMContentLoaded", function () {
  if (window.Pi) {
    Pi.init({ version: "2.0", sandbox: true });
    console.log("Pi SDK loaded");
  }

  setUIState("guest");
});

function setUIState(state, username = "") {
  const connectBtn = document.getElementById("connectBtn");
  const formSection = document.getElementById("formSection");
  const usernameDisplay = document.getElementById("usernameDisplay");

  if (state === "guest") {
    connectBtn.style.display = "block";
    formSection.style.display = "none";
    usernameDisplay.innerText = "";
  }

  if (state === "loggedIn") {
    connectBtn.style.display = "none";
    formSection.style.display = "block";
    usernameDisplay.innerText = "Logged in as: " + username;
  }
}

function onIncompletePaymentFound(payment) {
  console.log("Incomplete payment:", payment);
}

/* ---------------- LOGIN ---------------- */
async function connectWallet() {
  alert("Connect button clicked");

  try {
    if (!window.Pi) {
      alert("Pi SDK not available");
      return;
    }

    const scopes = ["username", "payments"];

    const authResult = await Pi.authenticate(scopes, onIncompletePaymentFound);

    if (!authResult || !authResult.user) {
      alert("Authentication failed");
      return;
    }

    console.log("AUTH RESULT:", authResult);

    setUIState("loggedIn", authResult.user.username);

  } catch (error) {
    console.error(error);
    alert("Connection failed");
  }
}

/* ---------------- PAYMENT ---------------- */
async function makePayment() {
  alert("Pay button clicked");

  try {
    if (!window.Pi) {
      alert("Open inside Pi Browser");
      return;
    }

    const paymentData = {
      amount: 1,
      memo: "IkejaElectricity Payment",
      metadata: { service: "electricity" }
    };

    const callbacks = {
      onReadyForServerApproval: function(paymentId) {
        console.log("Approval:", paymentId);

        fetch("/api/approve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ paymentId })
        });

        alert("Payment sent for approval");
      },

      onReadyForServerCompletion: function(paymentId, txid) {
        console.log("Completion:", paymentId, txid);

        fetch("/api/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ paymentId, txid })
        });

        alert("Payment completed");
      },

      onCancel: function() {
        alert("Payment cancelled");
      },

      onError: function(err) {
        console.error(err);
        alert("Payment error");
      }
    };

    await Pi.createPayment(paymentData, callbacks, { serverSide: true });

  } catch (err) {
    console.error(err);
    alert("Payment failed");
  }
}
</script>
</body>
</html>
