<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IkejaElectricity</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f5f5f5; }
    h1 { color: #333; }
    button { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background-color: #45a049; }
    .hidden { display: none; margin-top: 20px; }
    input { display: block; margin: 10px 0; padding: 8px; width: 250px; }
    #connecting { font-style: italic; color: #555; }
  </style>
</head>
<body>

  <h1>WELCOME TO IKEJAELECTRICITY</h1>
  <h2>Connect your Pi Wallet</h2>

  <!-- Connect Wallet Button -->
  <button id="connectBtn">Connect Pi Wallet</button>

  <!-- Connecting Message -->
  <p id="connecting" class="hidden">Connecting to Pi Wallet...</p>

  <!-- Message and Input Form (Hidden initially) -->
  <div id="walletForm" class="hidden">
    <p>Done successfully!</p>
    <h3>Enter your details:</h3>
    <input type="text" placeholder="Full Name" id="fullName">
    <input type="text" placeholder="Meter Number" id="meterNumber">
    <input type="email" placeholder="Email (optional)" id="email">
    <input type="tel" placeholder="Phone (optional)" id="phone">
    <input type="number" placeholder="Amount (Pi)" id="amount">
    <button id="submitBtn">Submit / Pay</button>
  </div>

  <script>
    const connectBtn = document.getElementById('connectBtn');
    const connecting = document.getElementById('connecting');
    const walletForm = document.getElementById('walletForm');

    connectBtn.addEventListener('click', () => {
      connectBtn.disabled = true; // prevent multiple clicks
      connecting.classList.remove('hidden'); // show connecting message

      // Simulate a delay for connecting animation
      setTimeout(() => {
        connecting.classList.add('hidden'); // hide connecting
        walletForm.classList.remove('hidden'); // show form
      }, 2000); // 2 seconds delay
    });
  </script>

</body>
</html>
