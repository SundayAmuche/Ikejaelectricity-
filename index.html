<!DOCTYPE html>
<html>
<head>
    <title>IkejaElectricity App</title>

    <style>
        body {
            background-color: #0b1f3a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #142f57;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        h1 {
            color: #00d4ff;
            font-size: 20px;
        }

        h2 {
            color: #00ff88;
            font-size: 16px;
        }

        h3 {
            color: #ffd700;
        }

        input {
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
        }

        button {
            padding: 12px;
            width: 100%;
            background-color: #00ff88;
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #00cc6a;
        }
    </style>

</head>

<body>

<div class="container">

<h1>WELCOME TO IKEJAELECTRICITY</h1>

<h2>Connect your Pi Wallet</h2>

<p><strong>Wallet Connected</strong></p>
<p>Pi Wallet connected successfully!</p>

<h3>Enter your details</h3>

<form>

    <input type="text" placeholder="Full Name">

    <input type="text" placeholder="Meter Number">

    <input type="number" placeholder="Amount (Pi)">

    <button type="submit">Submit / Pay</button>

</form>

</div>

</body>
</html>
