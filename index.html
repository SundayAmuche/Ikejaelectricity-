!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IkejaElectricity</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
      text-align: center;
    }
    h1 { margin-bottom: 20px; }
    h2 { margin-bottom: 30px; }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #4CAF50; /* green */
      color: white;
      border: none;
      border-radius: 5px;
    }
    .message {
      margin-top: 20px;
      color: white;
      background-color: #4CAF50; /* green */
      padding: 10px;
      border-radius: 5px;
      display: none; /* hidden initially */
    }
  </style>
</head>
<body>
  <h1>WELCOME TO IKEJAELECTRICITY</h1>
  <h2>Connect your Pi Wallet to continue</h2>

  <button id="connectBtn">Connect Pi Wallet</button>

  <div id="walletMessage" class="message">Wallet Connected<br>Pi Wallet connected successfully!</div>

  <script>
    const connectBtn = document.getElementById('connectBtn');
    const walletMessage = document.getElementById('walletMessage');

    connectBtn.addEventListener('click', () => {
      walletMessage.style.display = 'block'; // show message
      connectBtn.disabled = true; // optional: disable button after click
      connectBtn.textContent = 'Wallet Connected';
    });
  </script>
</body>
</html>
